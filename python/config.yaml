# WSP card analysis configuration
# All values here are used as defaults; CLI arguments override them at runtime.

scanner:
  dpi: 600

# Colour space used for card detection and droplet detection.
# 'lab' — perceptual LAB space (recommended; more robust to scanner differences)
# 'rgb' — direct RGB channels, matching the original MATLAB pipeline exactly
colour_space: lab

card_detection:
  # --- LAB mode (colour_space: lab) ---
  # LAB b* threshold: pixels above this are classified as yellow paper
  yellow_b_min: 15.0
  # LAB b* threshold: pixels below this are classified as blue stain
  blue_b_max: -8.0
  # Minimum LAB chroma to accept a blue pixel (rejects achromatic inter-card shadows)
  min_chroma: 10.0

  # --- RGB mode (colour_space: rgb) — values match original MATLAB code ---
  # Yellow paper: R > B + x  AND  G > B + x
  yellow_rg_over_b: 50
  # Blue stain:   B > R + x  AND  B > G + x
  blue_b_over_rg: 15

morphology:
  # Connected components smaller than this (pixels) are discarded as noise
  # MATLAB equivalent: bwareaopen(mask, 1000)
  min_card_area_px: 1000
  # Radius of the structuring element used for binary closing
  # MATLAB equivalent: strel('disk', 50)
  closing_radius: 50
  # Shape of the closing structuring element:
  #   'disk'        — true Euclidean disk (skimage disk(r)); slightly smaller than MATLAB's default
  #   'matlab_disk' — 16-sided convex polygon approximating MATLAB strel('disk', r, n=8);
  #                   extends ~1 px further at 22.5-degree bisector angles, matching MATLAB exactly
  closing_se: disk

droplet_detection:
  # --- LAB mode (colour_space: lab) ---
  # LAB b* upper bound: pixels below this (and inside the card mask) are stains
  droplet_b_max: 5.0
  # LAB L* upper bound: pixels above this are too bright to be stains (e.g. white scratches)
  droplet_l_max: 85.0

  # --- RGB mode (colour_space: rgb) — matches MATLAB binarizza_cartina3 (soglia=120) ---
  # Stain pixels satisfy R < droplet_r_max inside the card mask
  droplet_r_max: 120

  # --- Shared settings ---
  # Stains smaller than this area (px^2) are discarded as noise
  min_droplet_area_px: 1 #5
  # Stains larger than this area (px^2) are candidates for sub-segmentation
  subseg_area_threshold_px: 500
  # Card mask is eroded by this many pixels before droplet detection so that
  # border artefacts (raised-edge shadows, humidity streaks) are excluded
  border_erosion_px: 10
  # Opacity of the red stain overlay in the per-card detection images (0–1)
  overlay_alpha: 0.5
  # Sub-segmentation method for merged droplet blobs:
  #   'watershed'          — distance-transform watershed (default; works in both LAB and RGB)
  #   'adaptive_threshold' — MATLAB-compatible adaptive channel threshold (RGB mode only;
  #                          falls back to watershed in LAB mode)
  subseg_method: watershed
  # Initial channel threshold for adaptive_threshold mode (MATLAB: soglia_iniziale = 190)
  adaptive_initial_threshold: 190
  # Fraction for adaptive threshold interpolation (MATLAB: frazione = 2)
  # threshold = initial - (initial - min_channel_in_blob) / fraction
  adaptive_fraction: 2
  hist_bin_edges: [50, 100, 150, 200, 300, 400, 500, 600]
  # Maximum diameter (µm) shown on the cumulative distribution x-axis
  cumulative_max_diam_um: 1200
